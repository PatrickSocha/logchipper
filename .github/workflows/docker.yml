name: Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
    # Only files that end up in the image. (Tag pushes always build.)
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - static/**
      - internal/db/migrations/**
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest on master, 1.2.3 / 1.2 on v1.2.3 tags, plus the commit SHA
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Keep latest, every version tag, and the 10 newest sha-* builds; delete the
  # rest and anything untagged. This action understands multi-arch images, so
  # it won't delete the per-architecture images that a kept tag points to.
  cleanup:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: logchipper
          use-regex: true
          exclude-tags: '^(latest|\d+\.\d+(\.\d+)?)$'
          keep-n-tagged: 10
          delete-untagged: true
          validate: true
