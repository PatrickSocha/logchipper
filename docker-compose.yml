services:
  logchipper:
    image: ghcr.io/patricksocha/logchipper:latest
    ports:
      # This machine only. To accept logs from your LAN/VPC, replace
      # 127.0.0.1 with this host's private IP (e.g. 192.168.1.10 or 10.0.0.2).
      # Avoid 0.0.0.0 on hosts with a public IP.
      - "127.0.0.1:7070:7070"
      - "127.0.0.1:514:5514/udp"
      - "127.0.0.1:514:5514/tcp"
    volumes:
      - logchipper-data:/data
    environment:
      PORT: "7070"
      DB_PATH: /data/logchipper.db
      RETENTION_DAYS: "30"
      SYSLOG_ADDR: ":5514"    # published as 514 on the host
      SYSLOG_ENABLE: "true"
      AUTH: "true"            # first visit creates the login
      ACCESS_MODE: network    # local | network | internet
      ALLOWED_IPS: ""         # comma-separated IPs/CIDRs
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  logchipper-data:
